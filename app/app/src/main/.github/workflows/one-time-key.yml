name: "One-time: create signing key"

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias myapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=MyApp"

      - name: Prepare download
        run: base64 -w0 release.keystore > keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            release.keystore
            keystore-base64.txt
